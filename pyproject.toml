[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenqu-cli"
version = "0.1.0"
description = "Runtime CLI for Wenqu skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "gogoingai"}]
dependencies = [
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "crawl4ai>=0.6,<1",
]

[project.scripts]
wenqu = "wenqu.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
